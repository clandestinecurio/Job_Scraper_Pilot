name: Nightly Job Triage

on:
  schedule:
    # 09:00 UTC ≈ 1–2am PT — safely after the day's last scrapes (the biotech
    # digest actually lands ~07:00 UTC under GH cron delay; LinkedIn's last
    # hourly run is ~04:17 UTC). Exact timing isn't critical: the agent scores
    # every not-yet-scored role in all_jobs.json, so stragglers from a delayed
    # scrape simply roll into the next night's run.
    - cron: "0 9 * * *"

  workflow_dispatch:
    inputs:
      limit:
        description: "Maximum jobs to score in this run"
        required: false
        default: "10"
        type: string
      since_days:
        description: "Only score jobs first seen in the last N days"
        required: false
        default: "7"
        type: string

concurrency:
  group: job-scraper-commit-push
  cancel-in-progress: false

jobs:
  triage:
    name: Score new roles vs candidate profile
    # Scheduled AI scoring is opt-in because it incurs API cost. Manual runs
    # remain available for small validation batches before enabling the cron.
    if: github.event_name == 'workflow_dispatch' || vars.ENABLE_AI_TRIAGE == 'true'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout repo
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Anthropic SDK
        run: pip install anthropic

      # Profile/resume arrive as env vars straight from Actions secrets —
      # never written to disk, never committed (the repo is public).
      # --limit bounds worst-case daily spend; raise/lower as the cost knob.
      - name: Run triage agent
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CANDIDATE_PROFILE: ${{ secrets.CANDIDATE_PROFILE }}
          CANDIDATE_RESUME: ${{ secrets.CANDIDATE_RESUME }}
          TRIAGE_LIMIT: ${{ github.event.inputs.limit || vars.TRIAGE_LIMIT || '50' }}
          TRIAGE_SINCE_DAYS: ${{ github.event.inputs.since_days || vars.TRIAGE_SINCE_DAYS || '14' }}
        run: |
          python triage_agent.py \
            --limit "$TRIAGE_LIMIT" \
            --since "$TRIAGE_SINCE_DAYS" \
            --max-consecutive-errors 5

      - name: Commit scores to repo
        if: vars.ENABLE_DATA_COMMITS == 'true'
        run: |
          git config user.name  "${{ github.actor }}"
          git config user.email "${{ github.actor }}@users.noreply.github.com"
          git add -f output/scores.json
          git diff --cached --quiet || git commit -m "chore: update fit scores [$(date -u '+%Y-%m-%d %H:%MZ')]"
          git pull --rebase -X ours origin main
          git push
